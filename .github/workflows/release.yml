name: Release AION
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Download FFmpeg sidecars directly
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri\bin"
          $url1 = "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64.gz"
          $url2 = "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-win32-x64.gz"
          Invoke-WebRequest -Uri $url1 -OutFile "ffmpeg.gz"
          Invoke-WebRequest -Uri $url2 -OutFile "ffprobe.gz"
          
          $in1 = [System.IO.File]::OpenRead("$PWD\ffmpeg.gz")
          $gz1 = [System.IO.Compression.GZipStream]::new($in1, [System.IO.Compression.CompressionMode]::Decompress)
          $out1 = [System.IO.File]::Create("$PWD\src-tauri\bin\ffmpeg-x86_64-pc-windows-msvc.exe")
          $gz1.CopyTo($out1)
          $out1.Close(); $gz1.Close(); $in1.Close()
          
          $in2 = [System.IO.File]::OpenRead("$PWD\ffprobe.gz")
          $gz2 = [System.IO.Compression.GZipStream]::new($in2, [System.IO.Compression.CompressionMode]::Decompress)
          $out2 = [System.IO.File]::Create("$PWD\src-tauri\bin\ffprobe-x86_64-pc-windows-msvc.exe")
          $gz2.CopyTo($out2)
          $out2.Close(); $gz2.Close(); $in2.Close()

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: AION-v__VERSION__
          releaseName: 'AION Video Editor v__VERSION__'
          releaseBody: '새로운 AION 버전이 출시되었습니다! 아래에서 설치 파일을 다운로드하세요.'
          releaseDraft: false
          prerelease: false
          runnerArgs: "npm run tauri"
